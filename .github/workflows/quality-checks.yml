name: quality-checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  quality:
    name: typecheck-lint-deadcode-size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Biome lint
        run: pnpm lint

      - name: Biome format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: pnpm size
